name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # Exact version: see ci.yml.
          dotnet-version: 10.0.403

      - run: make build
      - run: make format
      - run: make test
      - run: make itest

  publish:
    needs: gates
    runs-on: ubuntu-latest
    # The nuget.org Trusted Publishing policy is restricted to this environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # Exact version: see ci.yml.
          dotnet-version: 10.0.403

      - name: Pack
        run: dotnet pack src/SqlMcp/SqlMcp.csproj -c Release -p:Version="${GITHUB_REF_NAME#v}" -o artifacts

      # The temporary API key lasts an hour, so log in just before the push.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
